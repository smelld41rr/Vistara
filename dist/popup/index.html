<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Vistara — Theme World</title>
    <link rel="stylesheet" href="../ui.css" />
  </head>
  <body class="popup">
    <header class="topbar">
      <div class="brand">
        <img src="../icons/icon48.png" alt="" />
        <div>
          <h1>Vistara<span style="color: #91b3ff">.</span></h1>
          <small>Theme World</small>
        </div>
      </div>
      <div class="header-actions">
        <span id="state" class="status">Loading</span>
        <div id="master"></div>
        <button id="settings" class="icon-button" aria-label="Open settings">
          ⚙
        </button>
      </div>
    </header>
    <main>
      <div id="preview"></div>
      <div class="section-heading">
        <h2>Coding scenes</h2>
        <span>YOUR WORLD</span>
      </div>
      <div id="scene-picker"></div>
      <details id="chatgpt-liquid-section" class="liquid-controls-section">
        <summary>ChatGPT — Liquid Glass</summary>
        <div id="liquid-controls"></div>
      </details>
      <div id="controls"></div>
      <div id="site" class="site-panel"></div>
      <div id="focus-toggle"></div>
      <div class="quick-actions">
        <button id="before" class="button" aria-pressed="false">
          ◐ Before / After</button
        ><button id="preset-reset" class="button">↺ Reset appearance</button>
      </div>
      <button id="repair" class="button" hidden>
        Connect to this page / Retry
      </button>
      <div id="notice" role="status" aria-live="polite"></div>
    </main>
    <footer class="footer">
      <span>Runs locally · No tracking</span
      ><button id="open-options" class="text-button">
        Open Theme Studio ↗
      </button>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
